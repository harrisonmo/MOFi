name: Setup script checks

on:
  push:
    paths:
      - "setup.sh"
      - "tests/test_setup_script.py"
      - ".github/workflows/setup.yml"
  pull_request:
    paths:
      - "setup.sh"
      - "tests/test_setup_script.py"
      - ".github/workflows/setup.yml"

permissions:
  contents: read

jobs:
  setup:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_setup_script.py -q
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
