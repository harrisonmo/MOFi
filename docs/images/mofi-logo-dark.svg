<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1400 360" width="1400" height="360" role="img" aria-labelledby="title desc">
  <title id="title">MOFi</title>
  <desc id="desc">The MOFi wordmark drawn as a metal-organic framework: metal nodes and organic linkers form the letters, a porous cage holds a CO2 molecule, a feedback orbit circles the dot of the i, and two framework cages flank the letters.</desc>
  <style>
    .lattice { stroke: #5AA9FF; stroke-width: 1.5; fill: none; }
    .lattice-node { fill: #5AA9FF; }
    .bond-outer { fill: none; stroke: #2F6FE0; stroke-width: 26; stroke-linecap: round; stroke-linejoin: round; }
    .bond-inner { fill: none; stroke: #A8D1FF; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
    .node { fill: #2BB59A; stroke: #DCE8FF; stroke-width: 4; }
    .link { stroke: #DCE8FF; stroke-width: 3.5; stroke-linecap: round; }
    .link-ring { fill: #0D1117; stroke: #DCE8FF; stroke-width: 2.5; stroke-linejoin: round; }
    .link-back { stroke: #DCE8FF; stroke-width: 2.5; stroke-linecap: round; opacity: 0.4; }
    .link-back-ring { fill: #0D1117; stroke: #DCE8FF; stroke-width: 2; stroke-linejoin: round; opacity: 0.4; }
    .imid { fill: #2BB59A; stroke: #DCE8FF; stroke-width: 2; stroke-linejoin: round; }
    .zn { fill: #1E88E5; stroke: #DCE8FF; stroke-width: 2.5; }
  </style>
  <defs>
    <!-- Periodic framework lattice used as a faint background. -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path class="lattice" d="M0 0 H60 M0 0 V60"/>
      <circle class="lattice-node" cx="0" cy="0" r="3"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="fade-mask">
      <rect width="1400" height="360" fill="url(#fade)"/>
    </mask>
    <radialGradient id="atom" cx="38%" cy="35%" r="70%">
      <stop offset="0" stop-color="#E6FFF8"/>
      <stop offset="0.45" stop-color="#2BB59A"/>
      <stop offset="1" stop-color="#1565C0"/>
    </radialGradient>
    <radialGradient id="pore" cx="40%" cy="38%" r="65%">
      <stop offset="0" stop-color="#FFF3C4" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#FFC94D" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#F5A623" stop-opacity="0.35"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#5AA9FF"/>
    </marker>

    <!-- Faceted metal octahedron (secondary building unit). -->
    <symbol id="metal" viewBox="-28 -30 56 60" overflow="visible">
      <polygon points="0,-26 -24,0 -7,7" fill="#90CAF9"/>
      <polygon points="0,-26 -7,7 24,0" fill="#1E88E5"/>
      <polygon points="-24,0 -7,7 0,26" fill="#1565C0"/>
      <polygon points="-7,7 24,0 0,26" fill="#0D47A1"/>
      <polygon points="0,-26 24,0 0,26 -24,0" fill="none" stroke="#DCE8FF" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M0 -26 L-7 7 L0 26 M-24 0 L-7 7 L24 0" fill="none" stroke="#DCE8FF" stroke-width="1.5" stroke-linejoin="round" opacity="0.7"/>
    </symbol>

    <!-- Letter skeletons: each stroke is a linker bond. -->
    <path id="M" d="M190 290 V80 L280 205 L370 80 V290"/>
    <path id="O" d="M550 80 L641 132.5 L641 237.5 L550 290 L459 237.5 L459 132.5 Z"/>
    <path id="F" d="M720 290 V80 H860 M720 182 H830"/>
    <path id="i" d="M960 145 V290"/>
  </defs>

  <!-- Background lattice, faded toward the edges. -->
  <rect width="1400" height="360" fill="url(#grid)" opacity="0.22" mask="url(#fade-mask)"/>

  <!-- Reference frameworks flanking the wordmark. -->
  <!-- MOF-5: cubic cage of Zn4O nodes and BDC linkers around a pore. -->
  <g class="motif">
    <line class="link-back" x1="108" y1="96" x2="208" y2="96"/>
    <polygon class="link-back-ring" points="167,96 162.5,103.8 153.5,103.8 149,96 153.5,88.2 162.5,88.2"/>
    <line class="link-back" x1="208" y1="96" x2="208" y2="196"/>
    <polygon class="link-back-ring" points="208,155 200.2,150.5 200.2,141.5 208,137 215.8,141.5 215.8,150.5"/>
    <line class="link-back" x1="208" y1="196" x2="108" y2="196"/>
    <polygon class="link-back-ring" points="149,196 153.5,188.2 162.5,188.2 167,196 162.5,203.8 153.5,203.8"/>
    <line class="link-back" x1="108" y1="196" x2="108" y2="96"/>
    <polygon class="link-back-ring" points="108,137 115.8,141.5 115.8,150.5 108,155 100.2,150.5 100.2,141.5"/>
    <line class="link-back" x1="62" y1="142" x2="108" y2="96"/>
    <polygon class="link-back-ring" points="91.4,112.6 93.7,121.3 87.3,127.7 78.6,125.4 76.3,116.7 82.7,110.3"/>
    <line class="link-back" x1="162" y1="142" x2="208" y2="96"/>
    <polygon class="link-back-ring" points="191.4,112.6 193.7,121.3 187.3,127.7 178.6,125.4 176.3,116.7 182.7,110.3"/>
    <line class="link-back" x1="162" y1="242" x2="208" y2="196"/>
    <polygon class="link-back-ring" points="191.4,212.6 193.7,221.3 187.3,227.7 178.6,225.4 176.3,216.7 182.7,210.3"/>
    <line class="link-back" x1="62" y1="242" x2="108" y2="196"/>
    <polygon class="link-back-ring" points="91.4,212.6 93.7,221.3 87.3,227.7 78.6,225.4 76.3,216.7 82.7,210.3"/>
    <circle cx="135" cy="169" r="40" fill="url(#pore)"/>
    <line class="link" x1="62" y1="142" x2="162" y2="142"/>
    <polygon class="link-ring" points="121,142 116.5,149.8 107.5,149.8 103,142 107.5,134.2 116.5,134.2"/>
    <line class="link" x1="162" y1="142" x2="162" y2="242"/>
    <polygon class="link-ring" points="162,201 154.2,196.5 154.2,187.5 162,183 169.8,187.5 169.8,196.5"/>
    <line class="link" x1="162" y1="242" x2="62" y2="242"/>
    <polygon class="link-ring" points="103,242 107.5,234.2 116.5,234.2 121,242 116.5,249.8 107.5,249.8"/>
    <line class="link" x1="62" y1="242" x2="62" y2="142"/>
    <polygon class="link-ring" points="62,183 69.8,187.5 69.8,196.5 62,201 54.2,196.5 54.2,187.5"/>
    <use xlink:href="#metal" href="#metal" x="96" y="83" width="24" height="26" opacity="0.75"/>
    <use xlink:href="#metal" href="#metal" x="196" y="83" width="24" height="26" opacity="0.75"/>
    <use xlink:href="#metal" href="#metal" x="196" y="183" width="24" height="26" opacity="0.75"/>
    <use xlink:href="#metal" href="#metal" x="96" y="183" width="24" height="26" opacity="0.75"/>
    <use xlink:href="#metal" href="#metal" x="47" y="126" width="30" height="32"/>
    <use xlink:href="#metal" href="#metal" x="147" y="126" width="30" height="32"/>
    <use xlink:href="#metal" href="#metal" x="147" y="226" width="30" height="32"/>
    <use xlink:href="#metal" href="#metal" x="47" y="226" width="30" height="32"/>
  </g>
  <!-- ZIF-8: sodalite cage of Zn nodes and imidazolate linkers around a pore. -->
  <g class="motif">
    <circle cx="1268" cy="175" r="50" fill="url(#pore)"/>
    <line class="link" x1="1336" y1="175" x2="1336" y2="209"/>
    <line class="link" x1="1336" y1="209" x2="1302" y2="243"/>
    <line class="link" x1="1302" y1="243" x2="1268" y2="243"/>
    <line class="link" x1="1268" y1="243" x2="1234" y2="243"/>
    <line class="link" x1="1234" y1="243" x2="1200" y2="209"/>
    <line class="link" x1="1200" y1="209" x2="1200" y2="175"/>
    <line class="link" x1="1200" y1="175" x2="1200" y2="141"/>
    <line class="link" x1="1200" y1="141" x2="1234" y2="107"/>
    <line class="link" x1="1234" y1="107" x2="1268" y2="107"/>
    <line class="link" x1="1268" y1="107" x2="1302" y2="107"/>
    <line class="link" x1="1302" y1="107" x2="1336" y2="141"/>
    <line class="link" x1="1336" y1="141" x2="1336" y2="175"/>
    <line class="link" x1="1302" y1="175" x2="1268" y2="209"/>
    <line class="link" x1="1268" y1="209" x2="1234" y2="175"/>
    <line class="link" x1="1234" y1="175" x2="1268" y2="141"/>
    <line class="link" x1="1268" y1="141" x2="1302" y2="175"/>
    <line class="link" x1="1302" y1="175" x2="1336" y2="175"/>
    <line class="link" x1="1268" y1="209" x2="1268" y2="243"/>
    <line class="link" x1="1234" y1="175" x2="1200" y2="175"/>
    <line class="link" x1="1268" y1="141" x2="1268" y2="107"/>
    <polygon class="imid" points="1342.5,192 1338,198.2 1330.7,195.8 1330.7,188.2 1338,185.8"/>
    <polygon class="imid" points="1323.6,230.6 1316,231.8 1312.6,225 1318,219.6 1324.8,223"/>
    <polygon class="imid" points="1285,249.5 1278.8,245 1281.2,237.7 1288.8,237.7 1291.2,245"/>
    <polygon class="imid" points="1251,249.5 1244.8,245 1247.2,237.7 1254.8,237.7 1257.2,245"/>
    <polygon class="imid" points="1212.4,230.6 1211.2,223 1218,219.6 1223.4,225 1220,231.8"/>
    <polygon class="imid" points="1193.5,192 1198,185.8 1205.3,188.2 1205.3,195.8 1198,198.2"/>
    <polygon class="imid" points="1193.5,158 1198,151.8 1205.3,154.2 1205.3,161.8 1198,164.2"/>
    <polygon class="imid" points="1212.4,119.4 1220,118.2 1223.4,125 1218,130.4 1211.2,127"/>
    <polygon class="imid" points="1251,100.5 1257.2,105 1254.8,112.3 1247.2,112.3 1244.8,105"/>
    <polygon class="imid" points="1285,100.5 1291.2,105 1288.8,112.3 1281.2,112.3 1278.8,105"/>
    <polygon class="imid" points="1323.6,119.4 1324.8,127 1318,130.4 1312.6,125 1316,118.2"/>
    <polygon class="imid" points="1342.5,158 1338,164.2 1330.7,161.8 1330.7,154.2 1338,151.8"/>
    <polygon class="imid" points="1289.6,196.6 1282,197.8 1278.6,191 1284,185.6 1290.8,189"/>
    <polygon class="imid" points="1246.4,196.6 1245.2,189 1252,185.6 1257.4,191 1254,197.8"/>
    <polygon class="imid" points="1246.4,153.4 1254,152.2 1257.4,159 1252,164.4 1245.2,161"/>
    <polygon class="imid" points="1289.6,153.4 1290.8,161 1284,164.4 1278.6,159 1282,152.2"/>
    <polygon class="imid" points="1319,168.5 1325.2,173 1322.8,180.3 1315.2,180.3 1312.8,173"/>
    <polygon class="imid" points="1274.5,226 1270,232.2 1262.7,229.8 1262.7,222.2 1270,219.8"/>
    <polygon class="imid" points="1217,181.5 1210.8,177 1213.2,169.7 1220.8,169.7 1223.2,177"/>
    <polygon class="imid" points="1261.5,124 1266,117.8 1273.3,120.2 1273.3,127.8 1266,130.2"/>
    <circle class="zn" cx="1336" cy="175" r="7"/>
    <circle class="zn" cx="1336" cy="209" r="7"/>
    <circle class="zn" cx="1302" cy="243" r="7"/>
    <circle class="zn" cx="1268" cy="243" r="7"/>
    <circle class="zn" cx="1234" cy="243" r="7"/>
    <circle class="zn" cx="1200" cy="209" r="7"/>
    <circle class="zn" cx="1200" cy="175" r="7"/>
    <circle class="zn" cx="1200" cy="141" r="7"/>
    <circle class="zn" cx="1234" cy="107" r="7"/>
    <circle class="zn" cx="1268" cy="107" r="7"/>
    <circle class="zn" cx="1302" cy="107" r="7"/>
    <circle class="zn" cx="1336" cy="141" r="7"/>
    <circle class="zn" cx="1302" cy="175" r="7"/>
    <circle class="zn" cx="1268" cy="209" r="7"/>
    <circle class="zn" cx="1234" cy="175" r="7"/>
    <circle class="zn" cx="1268" cy="141" r="7"/>
  </g>

  <!-- Wordmark. -->
  <g transform="translate(100 0)">
  <!-- O: porous cage interior with an adsorbed CO2 molecule. -->
  <use xlink:href="#O" href="#O" fill="#132A4A" stroke="none"/>
  <circle cx="550" cy="185" r="64" fill="none" stroke="#2BB59A" stroke-width="2.5" stroke-dasharray="5 7"/>
  <g transform="translate(550 185)">
    <path d="M-44 -5 H44 M-44 5 H44" stroke="#DCE8FF" stroke-width="4" stroke-linecap="round"/>
    <circle r="13" fill="#90A4AE" stroke="#DCE8FF" stroke-width="3"/>
    <circle cx="-46" r="15" fill="#E8505B" stroke="#DCE8FF" stroke-width="3"/>
    <circle cx="46" r="15" fill="#E8505B" stroke="#DCE8FF" stroke-width="3"/>
  </g>

  <!-- Linker bonds forming the letters. -->
  <g>
    <use xlink:href="#M" href="#M" class="bond-outer"/>
    <use xlink:href="#O" href="#O" class="bond-outer"/>
    <use xlink:href="#F" href="#F" class="bond-outer"/>
    <use xlink:href="#i" href="#i" class="bond-outer"/>
    <use xlink:href="#M" href="#M" class="bond-inner"/>
    <use xlink:href="#O" href="#O" class="bond-inner"/>
    <use xlink:href="#F" href="#F" class="bond-inner"/>
    <use xlink:href="#i" href="#i" class="bond-inner"/>
  </g>

  <!-- Organic nodes. -->
  <circle class="node" cx="280" cy="205" r="14"/>
  <circle class="node" cx="641" cy="132.5" r="12"/>
  <circle class="node" cx="641" cy="237.5" r="12"/>
  <circle class="node" cx="459" cy="132.5" r="12"/>
  <circle class="node" cx="459" cy="237.5" r="12"/>
  <circle class="node" cx="720" cy="182" r="12"/>
  <circle class="node" cx="860" cy="80" r="14"/>
  <circle class="node" cx="830" cy="182" r="14"/>
  <circle class="node" cx="960" cy="290" r="12"/>

  <!-- Metal nodes. -->
  <use xlink:href="#metal" href="#metal" x="162" y="50" width="56" height="60"/>
  <use xlink:href="#metal" href="#metal" x="342" y="50" width="56" height="60"/>
  <use xlink:href="#metal" href="#metal" x="162" y="260" width="56" height="60"/>
  <use xlink:href="#metal" href="#metal" x="342" y="260" width="56" height="60"/>
  <use xlink:href="#metal" href="#metal" x="526" y="54" width="48" height="52"/>
  <use xlink:href="#metal" href="#metal" x="526" y="264" width="48" height="52"/>
  <use xlink:href="#metal" href="#metal" x="692" y="50" width="56" height="60"/>
  <use xlink:href="#metal" href="#metal" x="692" y="260" width="56" height="60"/>

  <!-- i: glowing atom with a feedback orbit. -->
  <circle cx="960" cy="86" r="22" fill="#2BB59A" opacity="0.55" filter="url(#glow)"/>
  <g transform="translate(960 86) rotate(-18)">
    <path d="M-46 0 A46 17 0 1 1 -35.2 10.9" fill="none" stroke="#5AA9FF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  </g>
  <circle cx="960" cy="86" r="19" fill="url(#atom)" stroke="#DCE8FF" stroke-width="4"/>
  </g>
</svg>
