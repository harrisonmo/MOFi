<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Harness loops</title>
  <desc id="desc">The outer loop improves strategies, runs scientific tasks and evaluates results, then feeds the evaluation back into strategy improvement. Inside it, the inner loop runs tasks by sending actions to tools and receiving observations.</desc>
  <style>
    .lattice { stroke: #5AA9FF; stroke-width: 1.5; fill: none; }
    .lattice-node { fill: #5AA9FF; }
    .title { font: 700 44px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #DCE8FF; text-anchor: middle; }
    .box { fill: #132A4A; stroke: #5AA9FF; stroke-width: 3.5; }
    .tools { fill: #0F3B36; stroke: #2BB59A; stroke-width: 3.5; }
    .box-text { font: 700 30px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #DCE8FF; text-anchor: middle; dominant-baseline: central; }
    .loop-label { font: 700 26px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #DCE8FF; text-anchor: middle; }
    .flow-label { font: 600 22px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #9DB7E8; }
    .outer { fill: none; stroke: #4C9EFF; stroke-width: 6; stroke-linecap: round; }
    .inner { fill: none; stroke: #2BB59A; stroke-width: 6; stroke-linecap: round; }
  </style>
  <defs>
    <!-- Faint periodic framework lattice, shared with the MOFi wordmark. -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path class="lattice" d="M0 0 H60 M0 0 V60"/>
      <circle class="lattice-node" cx="0" cy="0" r="3"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="fade-mask">
      <rect width="1200" height="600" fill="url(#fade)"/>
    </mask>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4C9EFF"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2BB59A"/>
    </marker>
    <!-- Bond-style start node on each flow. -->
    <marker id="node-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="2.6" markerHeight="2.6">
      <circle cx="5" cy="5" r="4" fill="#4C9EFF" stroke="#DCE8FF" stroke-width="1.2"/>
    </marker>
    <marker id="node-teal" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="2.6" markerHeight="2.6">
      <circle cx="5" cy="5" r="4" fill="#2BB59A" stroke="#DCE8FF" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect width="1200" height="600" fill="url(#grid)" opacity="0.2" mask="url(#fade-mask)"/>

  <text class="title" x="600" y="62">Harness loops</text>

  <!-- Outer (evolution) loop: evaluation feeds back into strategy improvement. -->
  <path class="outer" d="M1000 234 V196 Q1000 152 956 152 H244 Q200 152 200 196 V231" marker-start="url(#node-blue)" marker-end="url(#arrow-blue)"/>
  <text class="loop-label" x="600" y="134">Outer loop</text>
  <text class="flow-label" x="600" y="186" text-anchor="middle">Feedback</text>

  <!-- Main pipeline. -->
  <path class="outer" d="M371 286 H426" marker-start="url(#node-blue)" marker-end="url(#arrow-blue)"/>
  <path class="outer" d="M771 286 H826" marker-start="url(#node-blue)" marker-end="url(#arrow-blue)"/>
  <rect class="box" x="35" y="240" width="330" height="92" rx="18"/>
  <rect class="box" x="435" y="240" width="330" height="92" rx="18"/>
  <rect class="box" x="835" y="240" width="330" height="92" rx="18"/>
  <text class="box-text" x="200" y="286">Improve strategies</text>
  <text class="box-text" x="600" y="286">Run scientific tasks</text>
  <text class="box-text" x="1000" y="286">Evaluate results</text>

  <!-- Inner (research) loop: actions go to tools, observations come back. -->
  <path class="inner" d="M555 338 V443" marker-start="url(#node-teal)" marker-end="url(#arrow-teal)"/>
  <path class="inner" d="M645 446 V341" marker-start="url(#node-teal)" marker-end="url(#arrow-teal)"/>
  <text class="flow-label" x="538" y="399" text-anchor="end">Actions</text>
  <text class="flow-label" x="662" y="399">Observations</text>
  <rect class="tools" x="455" y="452" width="290" height="88" rx="18"/>
  <text class="box-text" x="600" y="496">Use tools</text>
  <text class="loop-label" x="600" y="580">Inner loop</text>
</svg>
